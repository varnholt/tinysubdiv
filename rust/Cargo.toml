[package]
name = "tinysubdiv"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Loop subdivision, welding and normals for indexed triangle meshes"
license = "MIT"
repository = "https://github.com/varnholt/tinysubdiv"
readme = "README.md"
keywords = ["mesh", "subdivision", "geometry", "graphics"]
include = ["src/**", "examples/**", "tests/**", "tools/**", "Cargo.toml", "README.md", "LICENSE"]

[lints.rust]
unsafe_code = "forbid"
